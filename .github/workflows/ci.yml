name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-wasip2

      - name: Verify Rust toolchain
        run: |
          rustc --version
          cargo --version
          rustup target list --installed | grep wasm32-wasip2

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Component compilers
        run: |
          npm install --global @bytecodealliance/jco@1.32.1
          python -m pip install componentize-py==0.25.0
          jco --version
          componentize-py --version

      - name: Check Rust formatting
        run: |
          cargo fmt --all --check
          find tests/fixtures -name Cargo.toml -print0 \
            | while IFS= read -r -d '' manifest; do
                cargo fmt --manifest-path "$manifest" -- --check
              done

      - name: Check Rust workspace
        run: cargo check --workspace

      - name: Lint Rust workspace
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test Rust workspace
        run: cargo test --workspace

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release
