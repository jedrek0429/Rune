name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Verify Rust toolchain
        run: |
          rustc --version
          cargo --version
          rustup target list --installed | grep wasm32-unknown-unknown

      - name: Install Binaryen
        env:
          BINARYEN_VERSION: "131"
        run: |
          curl -fsSL \
            -o binaryen.tar.gz \
            "https://github.com/WebAssembly/binaryen/releases/download/version_${BINARYEN_VERSION}/binaryen-version_${BINARYEN_VERSION}-x86_64-linux.tar.gz"

          echo "b5bf1f0eaf17c63ee588ff7a5954dc8f6ce2c26989051c66f24dfe9ece3e46db  binaryen.tar.gz" \
            | sha256sum --check

          tar -xzf binaryen.tar.gz

          BINARYEN_BIN="$PWD/binaryen-version_${BINARYEN_VERSION}/bin"

          echo "$BINARYEN_BIN" >> "$GITHUB_PATH"
          export PATH="$BINARYEN_BIN:$PATH"

          wasm-opt --version
          wasm-merge --version

      - name: Install Extism compilers
        run: |
          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"

          curl -fsSLO \
            https://raw.githubusercontent.com/extism/js-pdk/main/install.sh
          bash install.sh
          rm install.sh

          curl -fsSL \
            https://raw.githubusercontent.com/extism/python-pdk/main/install.sh \
            | bash

          extism-js --help >/dev/null
          extism-py --help >/dev/null

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release

      - name: Test Firecracker invocation contract
        run: bash tests/firecracker/invocation-feature.test.sh

  firecracker-smoke:
    runs-on: ubuntu-latest
    env:
      RUNE_FIRECRACKER_ROOT: /tmp/rune-firecracker

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y e2fsprogs
          test -e /dev/kvm
          sudo chmod a+rw /dev/kvm

      - name: Install Firecracker and kernel
        env:
          FIRECRACKER_VERSION: v1.16.1
        run: |
          arch="$(uname -m)"
          curl -fsSL "https://github.com/firecracker-microvm/firecracker/releases/download/${FIRECRACKER_VERSION}/firecracker-${FIRECRACKER_VERSION}-${arch}.tgz" | tar -xz
          mkdir -p "$RUNNER_TEMP/bin" "$RUNE_FIRECRACKER_ROOT"
          install "release-${FIRECRACKER_VERSION}-${arch}/firecracker-${FIRECRACKER_VERSION}-${arch}" "$RUNNER_TEMP/bin/firecracker"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

          s3="https://s3.amazonaws.com/spec.ccfc.min"
          ci_prefix="$(curl -fsSL "$s3?list-type=2&prefix=firecracker-ci/&delimiter=/" | grep -oP '(?<=<Prefix>)firecracker-ci/[0-9]{8}-[^/]+/(?=</Prefix>)' | sort | tail -1)"
          kernel_key="$(curl -fsSL "$s3?list-type=2&prefix=${ci_prefix}${arch}/vmlinux-6.1" | grep -oP "(?<=<Key>)${ci_prefix}${arch}/vmlinux-6\\.1\\.[0-9]+(?=</Key>)" | sort -V | tail -1)"
          test -n "$kernel_key"
          curl -fsSL -o "$RUNE_FIRECRACKER_ROOT/vmlinux" "$s3/$kernel_key"

      - name: Execute prebuilt ELF in Firecracker
        run: tests/firecracker/invocation-e2e.sh
