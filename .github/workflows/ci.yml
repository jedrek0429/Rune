name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install Binaryen
        env:
          BINARYEN_VERSION: "131"
        run: |
          curl -fsSL \
            -o binaryen.tar.gz \
            "https://github.com/WebAssembly/binaryen/releases/download/version_${BINARYEN_VERSION}/binaryen-version_${BINARYEN_VERSION}-x86_64-linux.tar.gz"

          echo "b5bf1f0eaf17c63ee588ff7a5954dc8f6ce2c26989051c66f24dfe9ece3e46db  binaryen.tar.gz" \
            | sha256sum --check

          tar -xzf binaryen.tar.gz

          BINARYEN_BIN="$PWD/binaryen-version_${BINARYEN_VERSION}/bin"

          echo "$BINARYEN_BIN" >> "$GITHUB_PATH"
          export PATH="$BINARYEN_BIN:$PATH"

          wasm-opt --version
          wasm-merge --version

      - name: Install Extism compilers
        run: |
          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"

          curl -fsSLO \
            https://raw.githubusercontent.com/extism/js-pdk/main/install.sh
          bash install.sh
          rm install.sh

          curl -fsSL \
            https://raw.githubusercontent.com/extism/python-pdk/main/install.sh \
            | bash

          extism-js --help >/dev/null
          extism-py --help >/dev/null

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release
