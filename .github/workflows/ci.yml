name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Check workspace
        run: cargo check --workspace

      - name: Lint workspace
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test workspace
        run: cargo test --workspace

  dotnet:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Rune.slnx

      - name: Check formatting
        run: dotnet format Rune.slnx --no-restore --verify-no-changes

      - name: Build
        run: dotnet build Rune.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test Rune.slnx --no-build --configuration Release

  firecracker-smoke:
    runs-on: ubuntu-latest
    if: ${{ false }}
    steps:
      - run: echo "Enable this job on a self-hosted Linux runner with /dev/kvm."
