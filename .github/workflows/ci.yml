name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Check workspace
        run: cargo check --workspace

      - name: Lint workspace
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test workspace
        run: cargo test --workspace

      - name: Test Firecracker resource policy
        run: bash tests/firecracker/resource-policy.test.sh

  dotnet:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Rune.slnx

      - name: Check formatting
        run: dotnet format Rune.slnx --no-restore --verify-no-changes

      - name: Build
        run: dotnet build Rune.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test Rune.slnx --no-build --configuration Release

  firecracker-smoke:
    runs-on: ubuntu-latest
    env:
      RUNE_FIRECRACKER_ROOT: ${{ runner.temp }}/rune-firecracker

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y e2fsprogs redis-server
          test -e /dev/kvm
          sudo chmod a+rw /dev/kvm

      - name: Install Firecracker
        env:
          FIRECRACKER_VERSION: v1.16.1
        run: |
          arch="$(uname -m)"
          curl -fsSL "https://github.com/firecracker-microvm/firecracker/releases/download/${FIRECRACKER_VERSION}/firecracker-${FIRECRACKER_VERSION}-${arch}.tgz" | tar -xz
          mkdir -p "$RUNNER_TEMP/bin" "$RUNE_FIRECRACKER_ROOT"
          install "release-${FIRECRACKER_VERSION}-${arch}/firecracker-${FIRECRACKER_VERSION}-${arch}" "$RUNNER_TEMP/bin/firecracker"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          curl -fsSL -o "$RUNE_FIRECRACKER_ROOT/vmlinux" "https://s3.amazonaws.com/spec.ccfc.min/img/quickstart_guide/x86_64/kernels/vmlinux.bin"

      - name: Test all languages end to end
        run: tests/firecracker/e2e.sh
