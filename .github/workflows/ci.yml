name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check Rust formatting
        run: cargo fmt --all --check

      - name: Check Rust workspace
        run: cargo check --workspace

      - name: Lint Rust workspace
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test Rust workspace
        run: cargo test --workspace

      - name: Restore .NET
        run: dotnet restore Rune.slnx

      - name: Check C# formatting
        run: dotnet format Rune.slnx --no-restore --verify-no-changes

      - name: Build .NET
        run: dotnet build Rune.slnx --no-restore --configuration Release

      - name: Test .NET
        run: dotnet test Rune.slnx --no-build --configuration Release

  firecracker-smoke:
    runs-on: ubuntu-latest
    if: ${{ false }}
    steps:
      - run: echo "Enable this job on a self-hosted Linux runner with /dev/kvm."
